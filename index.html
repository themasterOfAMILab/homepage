<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub Pages와 Supabase를 연결한 회원가입·로그인 실습">
  <title>나의 회원 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>나의 회원 페이지</h1>
    <p id="status" role="status" aria-live="polite">연결 준비 중</p>
    <section id="guest-panel">
      <h2>회원가입 또는 로그인</h2>
      <form id="auth-form">
        <label for="email">전자우편</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        <button id="signup" type="button">회원가입</button>
        <button type="submit">로그인</button>
      </form>
    </section>
    <section id="member-panel" hidden>
      <h2>내 프로필</h2>
      <form id="profile-form">
        <label for="display-name">표시 이름</label>
        <input id="display-name" maxlength="30" required>
        <label for="introduction">자기소개</label>
        <textarea id="introduction" maxlength="300"></textarea>
        <button type="submit">내 프로필 저장</button>
      </form>
      <button id="logout" type="button">로그아웃</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
